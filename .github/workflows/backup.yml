name: Nightly backup
on:
  schedule:
    - cron: "0 19 * * *" # 台灣時間每天 03:00
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: 匯出 prod 資料
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs > backup.json
      - name: 加密（age 公鑰）
        env:
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$AGE_RECIPIENT" || { echo "缺少 BACKUP_AGE_RECIPIENT"; exit 1; }
          age -r "$AGE_RECIPIENT" -o "backup-$(date -u +%F).json.age" backup.json
          rm backup.json
      - uses: actions/upload-artifact@v7
        with:
          name: mumu-backup-${{ github.run_id }}
          path: backup-*.json.age
          retention-days: 90
